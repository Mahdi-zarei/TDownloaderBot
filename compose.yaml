# NovaBot: Telegram media downloader.
# Every service shares the host's network stack (network_mode: host), so they reach each other on
# 127.0.0.1 and every listener is bound to loopback only:
#   8081 Bot API, 8082 Bot API stats (healthcheck), 1080 WARP SOCKS5, 1081 Windscribe SOCKS5, 9091 metrics.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    build: .
    network_mode: host
    env_file: .env
    init: true
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./state:/state
      - ./secrets:/secrets:ro
      # Same path as inside telegram-bot-api: in --local mode getFile returns absolute paths there.
      - ./tg-bot-api:/var/lib/telegram-bot-api:ro
    depends_on:
      telegram-bot-api:
        condition: service_healthy
      warp:
        condition: service_started
    logging: *logging

  telegram-bot-api:
    build: ./telegram-bot-api
    network_mode: host
    init: true
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH in .env}
    volumes:
      # /data must have the same absolute path as in bot: uploads go by local path.
      - ./data:/data
      - ./tg-bot-api:/var/lib/telegram-bot-api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  # Cloudflare WARP as SOCKS5 on socks5h://127.0.0.1:1080. Healthcheck is defined in warp/Dockerfile.
  warp:
    build: ./warp
    network_mode: host
    init: true
    restart: unless-stopped
    environment:
      SOCKS_ADDR: 127.0.0.1:1080
    volumes:
      - ./warp-data:/var/lib/wgcf
    logging: *logging

  # Optional second egress from secrets/windscribe.conf on socks5h://127.0.0.1:1081.
  # Enable with `docker compose --profile windscribe up -d` (or COMPOSE_PROFILES=windscribe in .env).
  windscribe:
    build: ./warp
    network_mode: host
    profiles: [windscribe]
    init: true
    restart: unless-stopped
    environment:
      WG_CONFIG: /secrets/windscribe.conf
      SOCKS_ADDR: 127.0.0.1:1081
    volumes:
      - ./secrets:/secrets:ro
    logging: *logging
