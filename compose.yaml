# NovaBot: Telegram media downloader.
# Both services share the host's network stack (network_mode: host), so the bot reaches the Bot API
# server and any proxy you run on 127.0.0.1, and every listener is bound to loopback only:
#   8081 Bot API, 8082 Bot API stats (healthcheck), 9091 metrics.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    build: .
    network_mode: host
    env_file: .env
    init: true
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./state:/state
      - ./secrets:/secrets:ro
      # Same path as inside telegram-bot-api: in --local mode getFile returns absolute paths there.
      - ./tg-bot-api:/var/lib/telegram-bot-api:ro
    depends_on:
      telegram-bot-api:
        condition: service_healthy
    logging: *logging

  telegram-bot-api:
    build: ./telegram-bot-api
    network_mode: host
    init: true
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH in .env}
    volumes:
      # /data must have the same absolute path as in bot: uploads go by local path.
      - ./data:/data
      - ./tg-bot-api:/var/lib/telegram-bot-api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
